<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agents Workspace</title>
<style>
:root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#171717;background:#fafafa}*{box-sizing:border-box}body{margin:0}.shell{max-width:1180px;margin:auto;padding:36px 24px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid #e5e5e5;padding-bottom:24px}.brand{font-weight:700;font-size:23px;letter-spacing:-.8px}.muted{color:#737373;font-size:13px}button,input,textarea,select{font:inherit}button{background:#171717;color:white;border:1px solid #171717;border-radius:8px;padding:10px 14px;cursor:pointer}button.secondary{background:white;color:#171717;border-color:#ddd}button:disabled{opacity:.5;cursor:not-allowed}button:hover:not(:disabled){opacity:.85}.layout{display:grid;grid-template-columns:310px 1fr;gap:22px;margin-top:25px}.panel{background:white;border:1px solid #e7e7e7;border-radius:12px;padding:20px}h2{font-size:17px;margin:0 0 18px}label{display:block;font-size:12px;font-weight:600;margin:13px 0 6px}input,textarea,select{width:100%;padding:10px;border:1px solid #dedede;border-radius:7px;background:white}textarea{resize:vertical;min-height:90px}.full{width:100%;margin-top:16px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.metric{border:1px solid #e7e7e7;background:white;border-radius:10px;padding:16px}.num{font-size:28px;font-weight:650;margin:7px 0}.task{padding:17px 0;border-bottom:1px solid #eee}.task:first-child{padding-top:0}.task:last-child{border:0;padding-bottom:0}.task-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.task-title{font-weight:650}.tag{border-radius:5px;padding:4px 7px;font-size:11px;background:#f1f1f1;color:#555;white-space:nowrap}.pending_review{background:#fff4db;color:#805300}.approved{background:#e8f6ec;color:#226c36}.rejected{background:#feecec;color:#9b2626}.task small{color:#757575}.task-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.details{background:#fafafa;border-radius:8px;padding:13px;margin-top:13px;font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}summary{cursor:pointer;font-weight:600;margin-bottom:8px}.empty{padding:32px;text-align:center;color:#777;font-size:14px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.section-title h2{margin:0}.error{color:#ad2525;font-size:13px;margin:12px 0}.note{width:100%;margin-top:12px}kbd{background:#f4f4f4;padding:3px 5px;border:1px solid #ddd;border-radius:4px}@media(max-width:820px){.layout{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}.shell{padding:20px 13px}}
</style></head><body><div class="shell"><header class="top"><div><div class="brand">Agents Workspace</div><div class="muted">One queue for decisions across your agents</div></div><span class="tag" id="mode">Loading</span></header><div class="layout"><aside class="panel"><h2>Create task</h2><form id="create"><label for="title">Title</label><input id="title" required minlength="3" maxlength="160" placeholder="Review the next release"><label for="desc">Details</label><textarea id="desc" required minlength="3" placeholder="Describe an outcome and constraints"></textarea><label for="domain">Lead agent</label><select id="domain"><option value="engineering">Engineering</option><option value="research">Research</option><option value="operations">Operations</option></select><label for="priority">Priority</label><select id="priority"><option value="1">High</option><option value="2" selected>Normal</option><option value="3">Low</option></select><label for="screenshot">Screenshot URL</label><input id="screenshot" type="url" placeholder="https://…"><label for="video">Video demo URL</label><input id="video" type="url" placeholder="https://…"><button class="full">Add to queue</button></form><p class="muted">No task has external side effects. Approval records a decision, not code execution.</p><p class="muted">Shortcuts: <kbd>R</kbd> refresh, <kbd>N</kbd> new task, <kbd>J</kbd>/<kbd>K</kbd> next/previous review</p></aside><main><div class="metrics"><div class="metric"><span class="muted">Needs review</span><div class="num" id="reviewCount">0</div></div><div class="metric"><span class="muted">Open</span><div class="num" id="openCount">0</div></div><div class="metric"><span class="muted">Approved</span><div class="num" id="approvedCount">0</div></div></div><section class="panel"><div class="section-title"><h2>Decision queue</h2><button class="secondary" onclick="refresh()">Refresh</button></div><div id="error" class="error" role="alert"></div><div id="tasks"></div></section></main></div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...opts.headers}});if(!r.ok){let e;try{e=await r.json()}catch{}throw Error(e?.detail||`Request failed: ${r.status}`)}return r.json()}
function fail(e){document.getElementById('error').textContent=e.message||String(e)}
let items=[];
let focusedReview;
function evidenceLinks(evidence){
  if(!evidence.length)return '';
  return '<ul aria-label="Review evidence">'+evidence.map(item=>
    `<li><a href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">${esc({screenshot:'Screenshot',video:'Video demo',link:'Evidence'}[item.kind])}</a></li>`
  ).join('')+'</ul>';
}
function moveReview(direction){
  const reviews=items.filter(item=>item.status==='pending_review');
  if(!reviews.length)return;
  const current=reviews.findIndex(item=>item.id===focusedReview);
  const index=current===-1?(direction===1?0:reviews.length-1):
    (current+direction+reviews.length)%reviews.length;
  focusedReview=reviews[index].id;
  document.getElementById('task-'+focusedReview)?.focus();
}
async function refresh(){try{const [data,health]=await Promise.all([api('/api/tasks'),api('/api/health')]);items=data;document.getElementById('mode').textContent=health.mode==='demo'?'Demo mode — no LLM':'LLM connected';document.getElementById('reviewCount').textContent=data.filter(x=>x.status==='pending_review').length;document.getElementById('openCount').textContent=data.filter(x=>['new','rejected','pending_review'].includes(x.status)).length;document.getElementById('approvedCount').textContent=data.filter(x=>x.status==='approved').length;document.getElementById('tasks').innerHTML=data.length?data.map(t=>`<article class="task" id="task-${t.id}" tabindex="-1"><div class="task-head"><span class="task-title">${esc(t.title)}</span><span class="tag ${esc(t.status)}">${esc(t.status.replaceAll('_',' '))}</span></div><small>${esc(t.domain)} · P${t.priority} · #${t.id}</small><p>${esc(t.description)}</p>${evidenceLinks(t.evidence)}${t.chief_summary?`<details open><summary>Chief of Staff recommendation</summary><div class="details">${esc(t.chief_summary)}</div></details><details><summary>Lead proposal and specialist work</summary><div class="details">${esc(t.proposal)}\n\nSPECIALIST\n${esc(t.specialist_output)}</div></details>`:''}${['new','rejected'].includes(t.status)?`<div class="task-actions"><button data-run="${t.id}">Generate proposal</button></div>`:''}${t.status==='pending_review'?`<div class="task-actions"><button data-decision="approve" data-id="${t.id}">Approve</button><button class="secondary" data-decision="reject" data-id="${t.id}">Reject</button></div><textarea class="note" id="note-${t.id}" placeholder="Optional decision rationale (reused as agent memory)"></textarea>`:''}</article>`).join(''):'<div class="empty">No tasks yet. Create one to start.</div>';document.getElementById('error').textContent=''}catch(e){fail(e)}}
document.getElementById('create').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/tasks',{method:'POST',body:JSON.stringify({title:document.getElementById('title').value,description:document.getElementById('desc').value,domain:document.getElementById('domain').value,priority:Number(document.getElementById('priority').value),evidence:['screenshot','video'].map(kind=>({kind,url:document.getElementById(kind).value.trim()})).filter(item=>item.url)})});e.target.reset();await refresh()}catch(x){fail(x)}});
document.getElementById('tasks').addEventListener('click',async e=>{const btn=e.target.closest('button');if(!btn)return;btn.disabled=true;try{if(btn.dataset.run)await api(`/api/tasks/${btn.dataset.run}/run`,{method:'POST'});else if(btn.dataset.decision)await api(`/api/tasks/${btn.dataset.id}/decision`,{method:'POST',body:JSON.stringify({action:btn.dataset.decision,review_version:items.find(item=>item.id===Number(btn.dataset.id))?.updated_at,note:document.getElementById('note-'+btn.dataset.id)?.value||''})});await refresh()}catch(x){btn.disabled=false;fail(x)}});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key.toLowerCase()==='j')moveReview(1);if(e.key.toLowerCase()==='k')moveReview(-1);if(e.key.toLowerCase()==='r')refresh();if(e.key.toLowerCase()==='n')document.getElementById('title').focus()});refresh();
</script></body></html>
